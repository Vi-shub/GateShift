name: KinD smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  envoy-smoke:
    name: Envoy Gateway KinD smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux CLI
        run: go build -o bin/gateshift ./cmd/gateshift

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: gateshift
          wait: 120s

      - name: Install kubectl / curl helpers
        run: |
          kubectl version --client
          curl --version | head -n1

      - name: Run smoke test
        env:
          PF_PORT: "18080"
        run: bash scripts/test-smoke.sh
