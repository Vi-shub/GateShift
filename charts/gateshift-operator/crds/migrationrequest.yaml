apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: migrationrequests.gateshift.io
spec:
  group: gateshift.io
  scope: Namespaced
  names:
    plural: migrationrequests
    singular: migrationrequest
    kind: MigrationRequest
    shortNames:
      - mreq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: MigrationRequest drives an Ingress → Gateway API migration.
          properties:
            spec:
              type: object
              required: [sourceIngressRef, targetProvider]
              properties:
                sourceIngressRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                targetGatewayRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                targetProvider:
                  type: string
                  enum: [Standard, EnvoyGateway, Cilium, Istio, Kong]
                dryRun:
                  type: boolean
                  default: true
                gitops:
                  type: object
                  properties:
                    githubRepo:
                      type: string
                    gitlabProject:
                      type: string
                    autoCreatePR:
                      type: boolean
                      default: false
                    branchPrefix:
                      type: string
                      default: gateshift/
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                auditSummary:
                  type: object
                  properties:
                    direct:
                      type: integer
                    requiresPolicy:
                      type: integer
                    untranslatable:
                      type: integer
                prURL:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.targetProvider
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
