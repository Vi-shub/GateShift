replicaCount: 1

image:
  repository: ghcr.io/gateshift/gateshift-operator
  tag: "0.2.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: gateshift-operator

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

metrics:
  enabled: true
  port: 8080

githubToken:
  # Optional: create a Secret and reference it for GitOps PRs
  existingSecret: ""
  key: token
