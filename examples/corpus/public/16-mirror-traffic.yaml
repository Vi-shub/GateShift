apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirror-traffic
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: http://shadow.demo.svc.cluster.local
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: mirror.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: primary
                port:
                  number: 80
