apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtls-deep
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: demo/client-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/auth-tls-error-page: https://error.example.com/denied
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mtls.example.com
      secretName: mtls-tls
  rules:
    - host: mtls.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure
                port:
                  number: 8443
