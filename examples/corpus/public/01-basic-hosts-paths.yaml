# Structural baseline — hosts/paths/backends only (no annotations).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-app
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: basic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: basic-svc
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: basic-api
                port:
                  number: 8080
