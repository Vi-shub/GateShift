apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirror-regex
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/mirror: "true"
    nginx.ingress.kubernetes.io/mirror-target: http://shadow.demo.svc.cluster.local
spec:
  ingressClassName: nginx
  rules:
    - host: mirror.example.com
      http:
        paths:
          - path: /v[0-9]+/.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: mirror-primary
                port:
                  number: 8080
