# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gateshift

before:
  hooks:
    - go mod tidy

builds:
  - id: gateshift
    main: ./cmd/gateshift
    binary: gateshift
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/gateshift/gateshift/internal/cli.version={{.Version}}

  - id: gateshift-operator
    main: ./cmd/gateshift-operator
    binary: gateshift-operator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: gateshift
    builds:
      - gateshift
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: gateshift-operator
    builds:
      - gateshift-operator
    name_template: >-
      {{ .ProjectName }}-operator_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: gateshift
    name: gateshift
  draft: false
  prerelease: auto
  name_template: "GateShift {{.Version}}"

snapshot:
  version_template: "{{ .Tag }}-next"
